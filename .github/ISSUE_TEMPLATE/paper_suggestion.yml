name: Paper suggestion
description: Propose a work for the curated catalog (see CONTRIBUTING.md).
title: "[Paper] "
labels:
  - paper-suggestion
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping maintain Awesome Reliable Self-Evolving Agents.
        Include every item below; see [CONTRIBUTING.md](../../CONTRIBUTING.md)
        for classification guidance and rendered entry format.

        Do not infer an official repository from a matching name alone.

  - type: input
    id: canonical_title
    attributes:
      label: Canonical title
      description: Full paper title as it should appear in the catalog.
      placeholder: "MemAgent: Reshaping Long-Context LLM with Multi-Conv RL-based Memory Agent"
    validations:
      required: true

  - type: input
    id: canonical_paper_url
    attributes:
      label: Canonical paper URL
      description: arXiv, DOI, OpenReview, or proceedings URL (preferred over landing pages).
      placeholder: "https://arxiv.org/abs/2607.12345"
    validations:
      required: true

  - type: input
    id: first_public_date_and_venue
    attributes:
      label: First public date and venue
      description: First public release date and venue or preprint source, if known.
      placeholder: "2026-03 — ICLR 2026 (OpenReview)"
    validations:
      required: true

  - type: textarea
    id: official_code_and_project_urls
    attributes:
      label: Official code and project URLs
      description: One URL per line. Mark third-party mirrors explicitly.
      placeholder: |
        code: https://github.com/example/official-repo
        project: https://example.org/project-page
    validations:
      required: true

  - type: textarea
    id: code_project_evidence
    attributes:
      label: Evidence for code/project links
      description: Quote or link to the paper, project page, or README showing each URL is official.
      placeholder: |
        Paper abstract footer links to https://github.com/example/official-repo.
        Project page footer lists the same repository.
    validations:
      required: true

  - type: input
    id: proposed_level_and_subcategory
    attributes:
      label: Proposed L0-L4 level and subcategory
      description: Primary level (L0-L4) and taxonomy subcategory (e.g. L2.memory). Use facing/mixed/boundary if needed.
      placeholder: "L2 — L2.memory (mixed: also touches L1 self-training data)"
    validations:
      required: true

  - type: textarea
    id: evolution_target
    attributes:
      label: Deepest active evolution target (one sentence)
      description: One sentence naming what persists or changes across tasks, following the classification checklist in CONTRIBUTING.md.
      placeholder: "Persists retrieved memory snippets in a vector store reused across independent tasks."
    validations:
      required: true

  - type: dropdown
    id: persists_across_tasks
    attributes:
      label: Persists across independent tasks?
      description: Does the deepest active update persist across independent tasks (not just within one episode)?
      options:
        - "Yes — persists across independent tasks"
        - "No — limited to a single task or episode"
        - "Unclear — needs maintainer review"
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Optional notes, related works, or boundary-case rationale.
      placeholder: Related survey entries, duplicate candidates, or taxonomy edge cases.
